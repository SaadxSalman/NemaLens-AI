services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nemalens
      POSTGRES_USER: nemalens
      POSTGRES_PASSWORD: nemalens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  postgres_data:
  qdrant_storage:
